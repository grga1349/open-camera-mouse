# cargo-deny policy (docs/architecture/DEPENDENCIES.md). Run: `cargo deny check`.

[graph]
all-features = false

[licenses]
# Permissive licenses compatible with shipping an MIT app. Copyleft-only crates are refused.
# OFL-1.1 and Ubuntu-font-1.0 cover egui's bundled default fonts (epaint_default_fonts).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "0BSD",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# AGENTS.md: no OpenCV (or GoCV) in the new engine, not even via a camera crate feature.
deny = [
    { crate = "opencv", reason = "AGENTS.md: no OpenCV in the Rust rewrite" },
    { crate = "opencv-binding-generator", reason = "AGENTS.md: no OpenCV in the Rust rewrite" },
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
