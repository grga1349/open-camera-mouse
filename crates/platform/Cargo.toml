[package]
name = "platform"
description = "OS adapters (camera, pointer, permissions, hotkeys) implementing app-core ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Crates per ADR-0012 (docs/ARCHITECTURE.md §Dependencies). OS crates go per target.
[dependencies]
app-core.workspace = true
nokhwa.workspace = true
thiserror.workspace = true
toml.workspace = true
global-hotkey.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics.workspace = true
objc2-core-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true

[dev-dependencies]
tempfile.workspace = true
divan.workspace = true

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
