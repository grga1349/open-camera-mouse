# Website (ADR-0023, docs/WEBSITE.md). Builds website/ on PRs and pushes that touch it;
# deploys to GitHub Pages only from main (push or manual run), and only once the repository variable
# WEBSITE_DEPLOY is set to "true" (after Pages is enabled with source "GitHub Actions").
# No secrets: the deploy job uses the built-in OIDC token. The Rust CI ignores these paths.
# The download links are baked in at build time from the latest release (ADR-0023
# amendment 2), so publishing a release re-runs this workflow on main.
name: Website

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      # The manual's defaults test (src/lib/manual-defaults.test.ts) reads this file.
      - 'crates/app-core/src/settings.rs'
  push:
    branches: [main, feature/website]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      # The manual's defaults test (src/lib/manual-defaults.test.ts) reads this file.
      - 'crates/app-core/src/settings.rs'
  workflow_dispatch:
  # A release event runs on the tag ref, which the github-pages environment won't deploy
  # from; the `rebuild` job re-dispatches this workflow on main instead.
  release:
    types: [published]

# Least privilege by default; only the deploy job gets more.
permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  rebuild:
    name: rebuild for the new release
    if: github.event_name == 'release' && vars.WEBSITE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # workflow_dispatch is one of the events GITHUB_TOKEN may trigger.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    name: check and build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Version from "packageManager" in website/package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: website/package.json
      - name: install
        run: bun install --frozen-lockfile
      - name: astro check
        run: bun run check
      - name: unit tests
        run: bun run test
      # The build reads this file (src/lib/latest-release.ts). Fetched here, not in the
      # build, so the token never reaches the site's dependencies. On failure the site
      # falls back to an anonymous fetch, then to links to the Releases page.
      - name: latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src/data
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/latest" > src/data/latest-release.json; then
            rm -f src/data/latest-release.json
            echo "::warning::Couldn't read the latest release; the build tries without a token."
          fi
      # Includes scripts/check-paths.mjs: every internal URL stays under /open-camera-mouse/.
      - name: build
        run: bun run build
      - name: upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    # push or manual run on main only; never for pull_request, so PR code never reaches
    # this job or its token.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WEBSITE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
